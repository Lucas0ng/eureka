<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2EFE8" media="(prefers-color-scheme: light)">

<meta name="apple-mobile-web-app-title" content="Eureka！">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Eureka！灵感记事本</title>
<style>html{background:#F2EFE8} @media (prefers-color-scheme:dark){html{background:#0E0E0C}}</style>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">

<link rel="apple-touch-startup-image" href="splash/iphone-x-light.png" media="(prefers-color-scheme: light) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-x-dark.png" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

<link rel="apple-touch-startup-image" href="splash/iphone-11-dark.png" media="(prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-13-light.png" media="(prefers-color-scheme: light) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-13-dark.png" media="(prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-pro-light.png" media="(prefers-color-scheme: light) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-pro-dark.png" media="(prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-plus-light.png" media="(prefers-color-scheme: light) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-plus-dark.png" media="(prefers-color-scheme: dark) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-pm-light.png" media="(prefers-color-scheme: light) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-pm-dark.png" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pro-light.png" media="(prefers-color-scheme: light) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pro-dark.png" media="(prefers-color-scheme: dark) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pm-light.png" media="(prefers-color-scheme: light) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pm-dark.png" media="(prefers-color-scheme: dark) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
</head>
<body>
<main id="viewHome">
  <header class="page-head">
    <div>
      <h1>Eureka！</h1>
      <p id="homeSub" class="sub"></p>
    </div>
    <button type="button" id="pill" class="pill" aria-label="查看进度"></button>
  </header>

  <section class="card hero" id="pick">
    <div class="hero-top" id="heroTop">
      <p class="kicker">现在可以做这个</p>
      <button type="button" id="pickShuffle" class="text-btn">换一件</button>
    </div>
    <div id="pickBody">
      <h2 id="pickText"></h2>
      <p id="pickMeta" class="meta"></p>
      <button type="button" id="pickFocus" class="btn primary block">现在只做这一件</button>
      <button type="button" id="pickSplit" class="btn soft block">拆成 5 分钟</button>
    </div>
    <div id="pickEmpty" hidden>
      <p class="kicker">从一件小事开始</p>
      <h2>还没有要做的事</h2>
      <p class="meta">写在下面。选立刻去做，或先放进长期。</p>
    </div>
  </section>

  <section class="card composer" id="composer">
    <label class="sr" for="input">记下念头</label>
    <textarea id="input" rows="1" placeholder="突然想做什么？写下来……" enterkeyhint="done"></textarea>
    <div class="composer-more" id="composerMore" inert>
      <div class="composer-more-inner">
        <div class="ests" id="ests" role="group" aria-label="大概需要多久">
          <button type="button" data-m="5" aria-pressed="false">5 分钟</button>
          <button type="button" data-m="30" aria-pressed="false">30 分钟</button>
          <button type="button" data-m="60" aria-pressed="false">1 小时+</button>
        </div>
        <div class="pair">
          <button type="button" class="btn now" data-add="now">立刻去做</button>
          <button type="button" class="btn long" data-add="long">长期想做</button>
        </div>
        <p class="caption">回车保存。选了 1 小时以上，会放进长期。</p>
      </div>
    </div>
  </section>

  <div class="seg" id="segs" role="tablist" aria-label="清单">
    <button type="button" class="on" data-tab="now" role="tab" aria-selected="true">立刻去做</button>
    <button type="button" data-tab="long" role="tab" aria-selected="false">长期想做</button>
    <button type="button" data-tab="hist" role="tab" aria-selected="false">已完成</button>
  </div>
  <section class="card list-card" aria-label="清单">
    <ul id="list"></ul>
  </section>
</main>

<main id="viewStats" hidden>
  <header class="page-head">
    <div>
      <h1>进度</h1>
      <p class="sub">做完会留下来。断了一天，也没关系。</p>
    </div>
  </header>
  <section class="card level-card">
    <div class="level-top">
      <h2 id="lv"></h2>
      <p id="pts" class="pts"></p>
    </div>
    <div class="level-bar" aria-hidden="true"><i id="barFill"></i></div>
    <p id="toNext" class="meta"></p>
  </section>
  <section class="metrics" aria-label="统计">
    <div><b id="nToday">0</b><span>今天完成</span></div>
    <div><b id="nFocus">0</b><span>专注次数</span></div>
  </section>
  <section class="card grove-card" id="groveCard">
    <div class="grove-top">
      <div class="grove-countline">
        <h2 class="card-title">我的森林</h2>
        <p class="grove-total"><b id="groveCount">0</b><span>棵树</span></p>
      </div>
      <button type="button" id="openCodex" class="text-btn">图鉴</button>
    </div>
    <div class="rarity-chips" id="rarityChips" aria-label="稀有度"></div>
    <div class="codex-meter">
      <span>图鉴 <b id="codexFrac">0/30</b></span>
      <div class="codex-track" aria-hidden="true"><i id="codexFill"></i></div>
    </div>
    <div class="grove" id="grove">
      <div class="grove-sky" aria-hidden="true">
        <div class="sky-inner">
          <i class="sun"></i>
          <i class="moon"></i>
          <i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="star s5"></i><i class="star s6"></i>
          <i class="cloud cloud-a"></i>
          <i class="cloud cloud-b"></i>
          <svg class="bird bird-a" viewBox="0 0 40 16"><path d="M2 12 Q10 2 20 9 Q30 2 38 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg class="bird bird-b" viewBox="0 0 40 16"><path d="M2 12 Q10 2 20 9 Q30 2 38 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <i class="firefly f1"></i><i class="firefly f2"></i><i class="firefly f3"></i><i class="firefly f4"></i><i class="firefly f5"></i>
        </div>
      </div>
      <div class="grove-world" id="groveWorld"></div>
    </div>
    <div class="grove-pager" id="grovePager" hidden>
      <div class="grove-dots" id="groveDots" role="group" aria-label="选择小岛"></div>
      <p class="grove-page-label" id="grovePageLabel" aria-live="polite"></p>
    </div>
  </section>
  <section class="card">
    <h2 class="card-title">徽章</h2>
    <div class="badges" id="badges"></div>
  </section>
  <section class="card backup">
    <h2 class="card-title">数据</h2>
    <p class="meta">备份是一个文件。换手机时可以恢复，以前导出的备份也能用。</p>
    <div class="pair">
      <button type="button" id="exp" class="btn soft">备份数据</button>
      <button type="button" id="imp" class="btn soft">恢复备份</button>
    </div>
    <input type="file" id="impF" accept="application/json,.json" hidden>
  </section>
</main>

<nav class="tabbar" aria-label="视图">
  <button type="button" data-view="home" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.8 12 4l8 6.8V20a1 1 0 0 1-1 1h-5.2v-5.6h-3.6V21H5a1 1 0 0 1-1-1v-9.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>今天</span>
  </button>
  <button type="button" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>进度</span>
  </button>
</nav>

<section id="focus" class="focus" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="fText">
  <header class="focus-top">
    <button type="button" id="fExit" class="text-btn">先放下</button>
    <p id="fKicker" class="focus-kicker">专注</p>
  </header>
  <div class="focus-stage">
    <div class="grow">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="46"></circle>
        <circle id="ring" class="ring-val" cx="50" cy="50" r="46"></circle>
      </svg>
      <div class="tree-slot" id="plantSlot"></div>
    </div>
    <h2 id="fText" class="f-title"></h2>
    <p id="fQuestion" class="question" hidden>继续这件，还是换一件？</p>
    <div id="timer" class="timer">25:00</div>
    <p id="fReward" class="reward" hidden></p>
    <div id="lens" class="lens" role="group" aria-label="专注多久">
      <button type="button" data-l="5" aria-pressed="false">5 分钟</button>
      <button type="button" data-l="15" aria-pressed="false">15 分钟</button>
      <button type="button" data-l="25" aria-pressed="true" class="on">25 分钟</button>
    </div>
  </div>
  <footer class="focus-dock">
    <p id="fHint" class="focus-hint"></p>
    <div id="runBlock" class="dock-block">
      <button type="button" id="fPrimary" class="btn primary block">开始</button>
      <button type="button" id="fDone" class="btn soft block">做完了</button>
    </div>
    <div id="askBlock" class="dock-block" hidden>
      <button type="button" id="fCont" class="btn primary block">继续这件</button>
      <button type="button" id="fSwap" class="btn soft block">换一件</button>
    </div>
  </footer>
</section>

<div id="sheet" class="sheet-root" hidden>
  <div class="backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<svg class="ico-defs" width="0" height="0" aria-hidden="true">
  <defs>
    <symbol id="i-sprout" viewBox="0 0 24 24">
      <rect x="11" y="11" width="2" height="10" rx="1" fill="currentColor"></rect>
      <path fill="currentColor" d="M12 14C8 13.2 4.8 10.6 6 7.6 9.2 7.8 11.4 9.8 12 14z"></path>
      <path fill="currentColor" d="M12 11c.2-4 2.6-6.6 6.2-6.4-1 3.2-3.4 5.4-6.2 6.4z"></path>
    </symbol>
    <symbol id="i-sapling" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 3 15.2 8H8.8L12 3zm0 4.2L17 14H7L12 7.2z"></path>
      <rect x="10.8" y="13.2" width="2.4" height="6.4" rx="0.7" fill="currentColor"></rect>
    </symbol>
    <symbol id="i-tree" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 1.6 15.2 6.2H8.8L12 1.6zm0 3.8 5.6 6.6H6.4L12 5.4zm0 4.8 8.4 8H3.6l8.4-8z"></path>
      <rect x="10.6" y="16.8" width="2.8" height="5" rx="0.7" fill="currentColor"></rect>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.2 14.2 9.8 21.8 12 14.2 14.2 12 21.8 9.8 14.2 2.2 12 9.8 9.8Z"></path>
    </symbol>
    <symbol id="i-flame" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 1.7c1.2 3.4 5 5.1 5 9.5 0 3.4-2.6 6-5 6s-5-2.6-5-6c0-2.4 1.2-4.1 2.5-5.8.8 1.9 2.1 2.8 3.3 2.8-.7-2.4-.6-4.8-.2-7 .1.1.4.2.8.3.2-.3.4-.5.6-.8Z"></path>
    </symbol>
    <symbol id="i-crown" viewBox="0 0 24 24">
      <path fill="currentColor" d="M3 16.6 6.1 9.2 9.4 13.1 12 6.4l2.6 6.7 3.3-3.9L21 16.6H3Zm1.3 1.3h15.4v2.3H4.3v-2.3Z"></path>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 3.2 19.2 12h-4.4v8.6H9.2V12H4.8L12 3.2Z"></path>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path fill="currentColor" fill-rule="evenodd" d="M12 2.2a9.8 9.8 0 1 0 .02 19.6A9.8 9.8 0 0 0 12 2.2Zm-1.15 12.55-3.15-3.15 1.55-1.55 1.6 1.6 3.9-3.9 1.55 1.55-5.45 5.45Z"></path>
    </symbol>
    <symbol id="i-timer" viewBox="0 0 24 24">
      <circle cx="12" cy="13.2" r="6.6" fill="none" stroke="currentColor" stroke-width="2"></circle>
      <path d="M12 13.2V8.6M9.4 3.7h5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </symbol>
    <symbol id="i-timer-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="2"></circle>
      <path d="M8.3 12.2 10.8 14.7 15.8 9.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="i-ten" viewBox="0 0 24 24">
      <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" font-family="-apple-system,BlinkMacSystemFont,sans-serif">10</text>
    </symbol>
    <symbol id="i-e" viewBox="0 0 24 24">
      <path fill="currentColor" d="M4.5 3.8h4.4v16.4H4.5V3.8Zm0 0h11.2v4.2H4.5V3.8Zm0 6.1h15v4.2h-15V9.9Zm0 6.1h11.2v4.2H4.5v-4.2Z"></path>
    </symbol>
  </defs>
</svg>
<template id="treeTpl">
  <svg class="tree-svg" viewBox="0 0 64 80" aria-hidden="true">
    <g class="stage stage-sprout">
      <ellipse class="soil" cx="32" cy="74" rx="14" ry="3"></ellipse>
      <path class="stem" d="M32 74 V46"></path>
      <path class="leaf" d="M32 62C24 60 14 52 18 42c6 6 10 12 14 20z"></path>
      <path class="leaf-2" d="M32 54c8-2 18-8 16-18-8 4-12 12-16 18z"></path>
    </g>
    <g class="stage stage-sapling">
      <ellipse class="soil" cx="32" cy="74" rx="14" ry="3"></ellipse>
      <rect class="trunk" x="29.5" y="56" width="5" height="16" rx="1.4"></rect>
      <path class="leaf" d="M32 38c7 5 14 12 12 20-7 2-19 2-24 0-2-8 5-15 12-20z"></path>
      <path class="leaf-2" d="M32 24c5 4 10 10 8 16-5 2-13 2-16 0-2-6 3-12 8-16z"></path>
    </g>
    <g class="stage stage-tree">
      <ellipse class="soil" cx="32" cy="74" rx="15" ry="3.1"></ellipse>
      <rect class="trunk" x="29" y="56" width="6" height="16" rx="1.5"></rect>
      <path class="leaf" d="M32 36c9 6 18 13 15 24-9 3-24 3-30 0C14 49 23 42 32 36z"></path>
      <path class="leaf-2" d="M32 22c7 5 14 11 11 20-7 2-18 2-22 0-3-9 4-15 11-20z"></path>
      <path class="leaf" d="M32 10c5 4 9 8 8 15-5 2-12 2-16 0-1-7 3-11 8-15z"></path>
    </g>
  </svg>
</template>
<div id="codex" class="codex" hidden>
  <header class="codex-top">
    <button type="button" id="closeCodex" class="text-btn">返回</button>
    <h2>树木图鉴</h2>
    <span></span>
  </header>
  <p class="meta" id="codexNote"></p>
  <div class="codex-meter codex-meter-page">
    <span>收集 <b id="codexPageFrac">0/30</b></span>
    <div class="codex-track" aria-hidden="true"><i id="codexPageFill"></i></div>
  </div>
  <div class="codex-groups" id="codexGrid"></div>
</div>
<div id="reveal" class="reveal" hidden>
  <div class="reveal-card" id="revealCard">
    <p class="reveal-kicker" id="revealKicker"></p>
    <div class="plant-stage" id="plantStage">
      <i class="plant-flower pf1" aria-hidden="true"></i>
      <i class="plant-flower pf2" aria-hidden="true"></i>
      <i class="plant-mush" aria-hidden="true"></i>
      <div class="plant-soil" aria-hidden="true"></div>
      <div class="plant-sprout" aria-hidden="true">
        <svg viewBox="0 0 80 104" aria-hidden="true">
          <path d="M40 96 V62" fill="none" stroke="#3f6b32" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M40 78 C28 74 18 64 22 54 C30 60 36 68 40 76 Z" fill="#2f8a52"/>
          <path d="M40 70 C52 64 64 54 60 44 C50 52 44 60 40 68 Z" fill="#8fd09a"/>
          <ellipse cx="40" cy="98" rx="14" ry="3" fill="rgba(28,22,16,.2)"/>
        </svg>
      </div>
      <div class="plant-seed" aria-hidden="true"></div>
      <div class="reveal-art" id="revealArt"></div>
      <div class="plant-burst" id="revealBurst" aria-hidden="true"></div>
    </div>
    <h2 id="revealName"></h2>
    <p class="meta" id="revealMeta"></p>
    <button type="button" id="revealOk" class="btn primary block">收下</button>
  </div>
</div>
<div id="treeCard" class="tree-card" hidden>
  <button type="button" class="tree-card-back" id="treeCardBack" aria-label="关闭"></button>
  <article class="tree-sheet" id="treeSheet" role="dialog" aria-modal="true" aria-labelledby="treeSheetName">
    <div class="tree-sheet-art" id="treeSheetArt"></div>
    <div class="tree-sheet-kicker">
      <span class="tier" id="treeSheetTier"></span>
      <span class="tree-style" id="treeSheetStyle"></span>
    </div>
    <h2 id="treeSheetName"></h2>
    <p class="meta" id="treeSheetFrom"></p>
    <button type="button" id="treeSheetClose" class="btn primary block">好</button>
  </article>
</div>
<script src="js/trees.js"></script>
<script src="js/app.js"></script>
</body>
</html>
