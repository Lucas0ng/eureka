<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Eureka！灵感记事本</title>

<link rel="apple-touch-startup-image" href="splash/iphone-13-dark.png" media="(prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

<link rel="apple-touch-startup-image" href="splash/iphone-14-pro-dark.png" media="(prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-plus-light.png" media="(prefers-color-scheme: light) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-plus-dark.png" media="(prefers-color-scheme: dark) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-pm-light.png" media="(prefers-color-scheme: light) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-14-pm-dark.png" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pro-light.png" media="(prefers-color-scheme: light) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pro-dark.png" media="(prefers-color-scheme: dark) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pm-light.png" media="(prefers-color-scheme: light) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/iphone-16-pm-dark.png" media="(prefers-color-scheme: dark) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
</head>
<body>
<main id="viewHome">
  <header class="page-head">
    <div>
      <h1>Eureka！</h1>
      <p id="homeSub" class="sub"></p>
    </div>
    <button type="button" id="pill" class="pill" aria-label="查看进度"></button>
  </header>

  <section class="card hero" id="pick">
    <div class="hero-top" id="heroTop">
      <p class="kicker">现在可以做这个</p>
      <button type="button" id="pickShuffle" class="text-btn">换一件</button>
    </div>
    <div id="pickBody">
      <h2 id="pickText"></h2>
      <p id="pickMeta" class="meta"></p>
      <button type="button" id="pickFocus" class="btn primary block">现在只做这一件</button>
      <button type="button" id="pickSplit" class="btn soft block">拆成 5 分钟</button>
    </div>
    <div id="pickEmpty" hidden>
      <p class="kicker">从一件小事开始</p>
      <h2>还没有要做的事</h2>
      <p class="meta">写在下面。选立刻去做，或先放进长期。</p>
    </div>
  </section>

  <section class="card composer">
    <label class="sr" for="input">记下念头</label>
    <textarea id="input" rows="2" placeholder="突然想做什么？写下来……" enterkeyhint="done"></textarea>
    <div class="ests" id="ests" role="group" aria-label="大概需要多久">
      <button type="button" data-m="5" aria-pressed="false">5 分钟</button>
      <button type="button" data-m="30" aria-pressed="false">30 分钟</button>
      <button type="button" data-m="60" aria-pressed="false">1 小时+</button>
    </div>
    <div class="pair">
      <button type="button" class="btn now" data-add="now">立刻去做</button>
      <button type="button" class="btn long" data-add="long">长期想做</button>
    </div>
    <p class="caption">回车保存。选了 1 小时以上，会放进长期。</p>
  </section>

  <div class="seg" id="segs" role="tablist" aria-label="清单">
    <button type="button" class="on" data-tab="now" role="tab" aria-selected="true">立刻去做</button>
    <button type="button" data-tab="long" role="tab" aria-selected="false">长期想做</button>
    <button type="button" data-tab="hist" role="tab" aria-selected="false">已完成</button>
  </div>
  <section class="card list-card" aria-label="清单">
    <ul id="list"></ul>
  </section>
</main>

<main id="viewStats" hidden>
  <header class="page-head">
    <div>
      <h1>进度</h1>
      <p class="sub">做完会留下来。断了一天，也没关系。</p>
    </div>
  </header>
  <section class="card level-card">
    <div class="level-top">
      <h2 id="lv"></h2>
      <p id="pts" class="pts"></p>
    </div>
    <div class="level-bar" aria-hidden="true"><i id="barFill"></i></div>
    <p id="toNext" class="meta"></p>
  </section>
  <section class="metrics" aria-label="统计">
    <div><b id="nToday">0</b><span>今天完成</span></div>
    <div><b id="nStreak">0</b><span>连续天数</span></div>
    <div><b id="nFocus">0</b><span>专注次数</span></div>
  </section>
  <section class="card">
    <h2 class="card-title">最近 7 天</h2>
    <div class="week" id="week"></div>
  </section>
  <section class="card">
    <h2 class="card-title">专注森林</h2>
    <p class="meta" id="forestNote"></p>
    <div class="forest" id="garden"></div>
  </section>
  <section class="card">
    <h2 class="card-title">徽章</h2>
    <div class="badges" id="badges"></div>
  </section>
  <section class="card backup">
    <h2 class="card-title">数据</h2>
    <p class="meta">备份是一个文件。换手机时可以恢复，以前导出的备份也能用。</p>
    <div class="pair">
      <button type="button" id="exp" class="btn soft">备份数据</button>
      <button type="button" id="imp" class="btn soft">恢复备份</button>
    </div>
    <input type="file" id="impF" accept="application/json,.json" hidden>
  </section>
</main>

<nav class="tabbar" aria-label="视图">
  <button type="button" data-view="home" class="on" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.8 12 4l8 6.8V20a1 1 0 0 1-1 1h-5.2v-5.6h-3.6V21H5a1 1 0 0 1-1-1v-9.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span>今天</span>
  </button>
  <button type="button" data-view="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>进度</span>
  </button>
</nav>

<section id="focus" class="focus" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="fText">
  <header class="focus-top">
    <button type="button" id="fExit" class="text-btn">先放下</button>
    <p id="fKicker" class="focus-kicker">专注</p>
  </header>
  <div class="focus-stage">
    <div class="grow">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="46"></circle>
        <circle id="ring" class="ring-val" cx="50" cy="50" r="46"></circle>
      </svg>
      <div class="tree-slot" id="plantSlot"></div>
    </div>
    <h2 id="fText" class="f-title"></h2>
    <p id="fQuestion" class="question" hidden>继续这件，还是换一件？</p>
    <div id="timer" class="timer">25:00</div>
    <p id="fReward" class="reward" hidden></p>
    <div id="lens" class="lens" role="group" aria-label="专注多久">
      <button type="button" data-l="5" aria-pressed="false">5 分钟</button>
      <button type="button" data-l="15" aria-pressed="false">15 分钟</button>
      <button type="button" data-l="25" aria-pressed="true" class="on">25 分钟</button>
    </div>
  </div>
  <footer class="focus-dock">
    <p id="fHint" class="focus-hint"></p>
    <div id="runBlock" class="dock-block">
      <button type="button" id="fPrimary" class="btn primary block">开始</button>
      <button type="button" id="fDone" class="btn soft block">做完了</button>
    </div>
    <div id="askBlock" class="dock-block" hidden>
      <button type="button" id="fCont" class="btn primary block">继续这件</button>
      <button type="button" id="fSwap" class="btn soft block">换一件</button>
    </div>
  </footer>
</section>

<div id="sheet" class="sheet-root" hidden>
  <div class="backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<template id="treeTpl">
  <svg class="tree-svg" viewBox="0 0 120 150" aria-hidden="true">
    <ellipse class="soil" cx="60" cy="132" rx="34" ry="7"></ellipse>
    <g class="stage stage-seed">
      <ellipse class="trunk" cx="60" cy="124" rx="7" ry="4.5"></ellipse>
    </g>
    <g class="stage stage-sprout">
      <path class="stem" d="M60 130 C61 116 59 104 60 92"></path>
      <path class="leaf" d="M60 108 C44 104 34 90 42 80 C52 90 58 100 60 108Z"></path>
      <path class="leaf-2" d="M60 98 C78 92 90 78 80 68 C70 80 64 92 60 98Z"></path>
    </g>
    <g class="stage stage-sapling">
      <path class="trunk" d="M56.5 134 L58 98 Q60 90 62 98 L63.5 134Z"></path>
      <circle class="leaf-2" cx="44" cy="92" r="14"></circle>
      <circle class="leaf" cx="76" cy="90" r="15"></circle>
      <circle class="leaf" cx="60" cy="74" r="18"></circle>
    </g>
    <g class="stage stage-tree">
      <path class="trunk" d="M54 136 C55 114 56 98 58 84 L62 84 C64 98 65 114 66 136Z"></path>
      <circle class="leaf-2" cx="38" cy="92" r="16"></circle>
      <circle class="leaf" cx="84" cy="88" r="18"></circle>
      <circle class="leaf-2" cx="58" cy="96" r="14"></circle>
      <circle class="leaf" cx="60" cy="62" r="26"></circle>
      <circle class="leaf" cx="42" cy="74" r="14"></circle>
      <circle class="leaf-2" cx="80" cy="70" r="13"></circle>
      <circle class="highlight" cx="50" cy="52" r="7"></circle>
    </g>
  </svg>
</template>
<script src="js/app.js"></script>
</body>
</html>
